<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ركن القهوة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Centered hero above a zoomable isometric island; the two-storey cafe opens into a cutaway room with a draggable side panel (bottom sheet on phones).
   Deliberately a single light look: the scene is a daytime street, so every color is set explicitly. */
:root{
  --bg:#dde8e7;
  --stage:#eef4f3;
  --paper:#fbfdfc;
  --ink:#1d2b31;
  --ink2:#51646b;
  --line:#cbd9d8;
  --teal:#2f9a93;
  --teal-d:#245f5b;
  --coral:#c54a2b;
  --sun:#f2bd4b;
  --display:'Lalezar','Rubik','Segoe UI',Tahoma,system-ui,sans-serif;
  --body:'Rubik','Segoe UI',Tahoma,system-ui,sans-serif;
  --hero-h:168px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--ink);background:none;border:0;padding:6px 0}
.brand svg{width:30px;height:30px}
.nav{display:flex;gap:8px}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:500;line-height:1.2;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:#fff}
.btn.fill{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.fill:hover{background:#a93a1f;border-color:#a93a1f}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* stage */
.stage{position:relative;flex:1;min-height:0;margin-bottom:12px;overflow:hidden;border-radius:24px;
  background:radial-gradient(120% 90% at 50% 0%,#f8fbfa 0%,#eaf1f0 55%,#dce8e7 100%);border:1px solid var(--line)}
.hero{position:absolute;inset:0 0 auto 0;height:var(--hero-h);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 20px 0;z-index:2;transition:opacity .45s,transform .6s;pointer-events:none}
.hero .eyebrow{margin:0;color:var(--teal-d);font-weight:500;font-size:.9rem}
.hero h1{margin:2px 0 4px;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,6.4vw,4.2rem);line-height:1.05;color:var(--ink);text-wrap:balance}
.hero .sub{margin:0;max-width:34rem;color:var(--ink2);font-size:.95rem;text-wrap:balance}
.hero .drag-hint{margin:4px 0 0;color:var(--ink2);font-size:.8rem;opacity:.85}
.in-mode .hero{opacity:0;transform:translateY(-16px)}
#scene{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.panning #scene,.stage.panning [data-act]{cursor:grabbing}
.zoom{position:absolute;z-index:4;left:12px;top:calc(var(--hero-h) + 4px);display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.zoom .btn{min-width:38px;height:38px;padding:0 12px;background:var(--paper);border-color:var(--line);display:grid;place-items:center;font-size:1.15rem;line-height:1}
.zoom .btn:hover{background:var(--ink);border-color:var(--ink)}
.zoom #recenter{font-size:.8rem}
.cta{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;padding:11px 28px;font-size:1rem;transition:opacity .3s,background .2s}
.in-mode .cta{opacity:0;visibility:hidden;pointer-events:none}

#scene{position:absolute;left:0;right:0;bottom:0;top:var(--hero-h);width:100%;height:calc(100% - var(--hero-h));overflow:visible;display:block}
#scene text{font-family:var(--body)}
#scene .disp{font-family:var(--display)}
#cam{transition:transform 1.15s cubic-bezier(.55,0,.15,1)}
[data-act]{cursor:pointer;outline:none}
[data-act]:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hit{transition:filter .2s}
.hit:hover{filter:brightness(1.07)}

/* mode + floor switching: svg class is "out", "in f0" or "in f1" */
#g-int,#u-int{opacity:0;pointer-events:none;transition:opacity .45s}
.f0 #g-int{opacity:1;pointer-events:auto;transition:opacity .6s .35s}
.f1 #u-int{opacity:1;pointer-events:auto;transition:opacity .6s .35s}
#g-shell{transition:opacity .45s,transform .7s}
.f0 #g-shell{opacity:0;transform:translateY(16px)}
.in #g-shell{pointer-events:none}
#u-shell{transition:opacity .45s,transform .8s}
.in #u-shell{opacity:0;transform:translateY(-30px);pointer-events:none}
#roof{transition:opacity .55s .1s,transform 1s cubic-bezier(.4,0,.2,1)}
.in #roof{opacity:0;transform:translateY(-190px);pointer-events:none}
.out #cafe:hover #g-shell,.out #cafe:hover #u-shell,.out #cafe:hover #roof{filter:brightness(1.06)}
.near{transition:opacity .5s}
.in .near{opacity:0}
.only-out{transition:opacity .3s}
.in .only-out{opacity:0;pointer-events:none}

/* ambient motion */
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.cloud{animation:drift 15s ease-in-out infinite alternate}
.cloud.b{animation-duration:21s;animation-direction:alternate-reverse}
@keyframes driveA{0%{transform:translate(-51px,-25px);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translate(442px,221px);opacity:0}}
@keyframes driveB{0%{transform:translate(442px,221px);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translate(-51px,-25px);opacity:0}}
.carA{animation:driveA 15s linear infinite}
.carB{animation:driveB 21s linear infinite}
@keyframes walk{0%{transform:translate(-20px,-10px);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translate(420px,210px);opacity:0}}
.walker{animation:walk 46s linear infinite}
@keyframes hop{to{transform:translateY(-1.6px)}}
.hopper{animation:hop .45s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite alternate}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-16px)}}
.steam path{animation:steam 3.2s ease-in-out infinite;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
.steam path:nth-child(2){animation-delay:.9s}
.steam path:nth-child(3){animation-delay:1.8s}
@keyframes bob{50%{transform:translateY(-5px)}}
.pinbob{animation:bob 2.2s ease-in-out infinite}
.tbl .ring{opacity:0;transition:opacity .2s}
.tbl:hover .ring,.tbl.sel .ring,.tbl:focus-visible .ring{opacity:1}
.tbl.busy{cursor:not-allowed}
.tbl.busy .ring,.tbl.res .ring{stroke:#8b9aa0}

/* tooltip + toast */
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#fff;font-size:.82rem;padding:5px 11px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-140%)}
.toast{position:absolute;z-index:8;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;max-width:min(92%,420px);text-align:center;box-shadow:0 10px 30px rgba(20,40,45,.25)}

/* panel (draggable by its header) */
.panel{position:absolute;z-index:6;top:12px;bottom:12px;inset-inline-start:12px;width:min(390px,calc(100% - 24px));display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(25,50,55,.18);
  translate:var(--dx,0px) var(--dy,0px);
  transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .6s cubic-bezier(.3,0,.2,1),visibility 0s .6s}
.panel.open{transform:none;visibility:visible;transition:transform .6s .5s cubic-bezier(.3,0,.2,1),visibility 0s .5s}
.panel.dragging{box-shadow:0 24px 60px rgba(25,50,55,.3)}
.p-head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 16px 8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.panel.dragging .p-head{cursor:grabbing}
.p-head::before{content:"";position:absolute;top:8px;left:50%;width:44px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.p-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1}
.p-head p{margin:2px 0 0;color:var(--ink2);font-size:.85rem}
.p-head .btn{padding:6px 14px;font-size:.88rem;flex:none;cursor:pointer}
.floors{display:flex;gap:6px;padding:2px 16px 8px}
.fbtn{flex:1;border:1.5px solid var(--line);border-radius:999px;background:transparent;padding:5px 8px;font-size:.85rem;color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 16px 8px;background:var(--bg);border-radius:14px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px;font-weight:500;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px}
.foot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.note{margin:0;color:var(--ink2);font-size:.8rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:.88rem;color:var(--ink)}
.chip[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.hot{background:#f1e1d2;color:#7a4a2b}
.ico.cold{background:#d6efec;color:#1f6f6a}
.ico.sweet{background:#f9dcd3;color:#a8391c}
.ico.bite{background:#faedc9;color:#7d5a07}
.txt{min-width:0}
.txt b{display:block;font-weight:500}
.txt span{display:block;color:var(--ink2);font-size:.8rem;line-height:1.35}
.buy{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.price{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.add{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:3px 14px;font-size:.85rem;font-weight:500}
.add:hover{background:var(--ink);color:#fff}
.step{display:flex;align-items:center;gap:2px;background:var(--ink);color:#fff;border-radius:999px}
.step button{width:30px;height:28px;border:0;background:transparent;color:#fff;font-size:1.1rem;line-height:1}
.step output{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.cartbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.cartbar b{display:block;font-weight:500}
.cartbar span{color:var(--ink2);font-size:.85rem;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 4px;font-size:.8rem;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.fl{margin:12px 0 8px;font-size:.85rem;font-weight:500;color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tcard{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcard b{font-weight:500}
.tcard span{font-size:.78rem;color:var(--ink2)}
.tcard[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.tcard:disabled{opacity:.55;cursor:not-allowed;background:transparent}
.tcard.mine{border-color:var(--sun);box-shadow:inset 0 0 0 1.5px var(--sun)}
.form{margin-top:14px;padding:14px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.form h3{margin:0;font-weight:500;font-size:1rem}
.form h3 small{display:block;font-weight:400;font-size:.8rem;color:var(--ink2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{display:block;margin-bottom:6px;font-size:.85rem;color:var(--ink2)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.timein{font:inherit;width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.err{min-height:1.2em;margin:0;color:#a93a1f;font-size:.82rem}
.banner{margin-top:14px;padding:14px;border-radius:16px;background:#fdf1cf;color:#4d3a05;display:flex;flex-direction:column;gap:10px}
.banner b{font-weight:500}
.hint{margin:14px 0 0;color:var(--ink2);font-size:.88rem}

@media (max-width:820px){
  :root{--hero-h:196px}
  .top{height:54px}
  .brand{font-size:1.4rem}
  .btn{padding:7px 14px;font-size:.9rem}
  .panel{top:auto;inset-inline:0;bottom:0;width:auto;height:min(62%,520px);border-radius:20px 20px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
}
@media (max-width:430px){
  .nav .btn:first-child{display:none}
  .hero .sub{font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <button class="brand" id="home" type="button" aria-label="ركن القهوة، رجوع للواجهة">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h17v7a8 8 0 0 1-8 8h-1a8 8 0 0 1-8-8v-7z" fill="#2f9a93"/><path d="M5 12h17v3H5z" fill="#245f5b"/><path d="M22 14h2.5a3.5 3.5 0 0 1 0 7H22" fill="none" stroke="#2f9a93" stroke-width="2.6" stroke-linecap="round"/><path d="M10 3c0 2.2 2 2.2 2 4.5M16 3c0 2.2 2 2.2 2 4.5" fill="none" stroke="#c54a2b" stroke-width="2" stroke-linecap="round"/></svg>
      <span>ركن القهوة</span>
    </button>
    <nav class="nav" aria-label="التنقل">
      <button class="btn" type="button" data-go="menu">المنيو</button>
      <button class="btn fill" type="button" data-go="tables">احجز طاولة</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <div class="hero" id="hero">
      <p class="eyebrow">كافيه بطابقين · جولة تفاعلية</p>
      <h1>ركن القهوة</h1>
      <p class="sub">اضغط على الكافيه وادخل. شوف الطاولات الفاضية بالطابقين، تصفح المنيو، واحجز بالوقت اللي يناسبك.</p>
      <p class="drag-hint">اسحب بالماوس لتحريك المشهد، وعجلة الماوس للتكبير</p>
    </div>

    <svg id="scene" class="out" viewBox="60 -85 880 725" preserveAspectRatio="xMidYMid meet" role="img" aria-label="مشهد isometric لكافيه بطابقين على جزيرة صغيرة مع شارع">
      <defs id="defs"></defs>
      <g id="pan"><g id="cam"><g id="world"></g></g></g>
    </svg>

    <div class="zoom" role="group" aria-label="التحكم بالعرض">
      <button class="btn" type="button" data-zoom="1.25" aria-label="تكبير" title="تكبير">+</button>
      <button class="btn" type="button" data-zoom="0.8" aria-label="تصغير" title="تصغير">−</button>
      <button class="btn" type="button" id="recenter" hidden>توسيط</button>
    </div>
    <button class="btn fill cta" type="button" data-go="menu">ادخل الكافيه</button>

    <aside class="panel" id="panel" aria-label="داخل الكافيه" inert>
      <div class="p-head" id="phead" title="اسحب اللوحة لتحريكها، واضغط مرتين لإرجاعها">
        <div>
          <h2>داخل الكافيه</h2>
          <p>مفتوح من 8 صباحاً إلى 12 ليلاً</p>
        </div>
        <button class="btn" type="button" id="exit">خروج</button>
      </div>
      <div class="floors" role="group" aria-label="الطابق">
        <button class="fbtn" type="button" data-floor="0" aria-pressed="true">الطابق الأرضي</button>
        <button class="fbtn" type="button" data-floor="1" aria-pressed="false">الطابق الثاني</button>
      </div>
      <div class="tabs" role="tablist" aria-label="أقسام الكافيه">
        <button class="tab" role="tab" id="tab-menu" data-tab="menu" aria-selected="true">المنيو</button>
        <button class="tab" role="tab" id="tab-tables" data-tab="tables" aria-selected="false">الطاولات والحجز</button>
      </div>
      <div class="scroll" id="pane" role="tabpanel"></div>
      <div class="foot" id="foot"></div>
    </aside>

    <div class="tip" id="tip" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};

/* ---------- isometric helpers ---------- */
var U=34,OX=500,OY=150,ZOFF=0;
function P(x,y,z){z=(z||0)+ZOFF;return [OX+(x-y)*U, OY+(x+y)*U/2-z];}
function f(n){return Math.round(n*100)/100;}
function pts(a){return a.map(function(p){return f(p[0])+','+f(p[1]);}).join(' ');}
function mix(h,t,a){
  function p(s){return [1,3,5].map(function(i){return parseInt(s.slice(i,i+2),16);});}
  var A=p(h),B=p(t);
  return '#'+A.map(function(v,i){return Math.round(v+(B[i]-v)*a).toString(16).padStart(2,'0');}).join('');
}
function tone(h){return [mix(h,'#ffffff',.28),h,mix(h,'#0b1a20',.2)];}
function poly(w,fill,ex){
  return '<polygon points="'+pts(w.map(function(p){return P(p[0],p[1],p[2]);}))+'" fill="'+fill+'" stroke="'+fill+'" stroke-width=".7" stroke-linejoin="round" '+(ex||'')+'/>';
}
function box(x,y,z,w,d,h,c,ex){
  return '<g '+(ex||'')+'>'+
    poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c[1])+
    poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c[2])+
    poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c[0])+'</g>';
}
function flat(x0,y0,x1,y1,z,fill,ex){return poly([[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],fill,ex);}
function wy(x0,x1,z0,z1,y,fill,ex){return poly([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],fill,ex);}
function wx(y0,y1,z0,z1,x,fill,ex){return poly([[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]],fill,ex);}
function txtY(x,z,y,s,fill,size,ex){var p=P(x,y,z);return '<text transform="matrix(1 .5 0 1 '+f(p[0])+' '+f(p[1])+')" text-anchor="middle" font-size="'+size+'" fill="'+fill+'" '+(ex||'')+'>'+s+'</text>';}
function onX(x,y,z,inner){var p=P(x,y,z);return '<g transform="matrix(1 -.5 0 1 '+f(p[0])+' '+f(p[1])+')">'+inner+'</g>';}
var defs=[],defsN=0;
function grad(c){

function camIn(){
  var svg=$('#scene'),r=svg.getBoundingClientRect(),k=Math.min(r.width/VB.w,r.height/VB.h);
  var offX=(r.width-VB.w*k)/2,offY=(r.height-VB.h*k)/2;
  var st=$('#stage').getBoundingClientRect(),wide=window.innerWidth>820;
  var pw=wide?$('#panel').offsetWidth+24:0,ph=wide?0:$('#panel').offsetHeight;
  /* the panel starts at the right edge (RTL), so the free area is the left part */
  var fxp=st.left+(st.width-pw)/2,fyp=st.top+(st.height-ph)/2;
  var tx=VB.x+(fxp-r.left-offX)/k,ty=VB.y+(fyp-r.top-offY)/k;
  var fw=(st.width-pw)/k,fh=(st.height-ph)/k;
  var s=Math.max(1,Math.min(fw/420,fh/400,2.8));
  var c=P(4.6,3.3,34+S.floor*H);
  return 'translate('+f(tx-s*c[0])+'px,'+f(ty-s*c[1])+'px) scale('+f(s)+')';
}

function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3200);
}

/* ---------- panel ---------- */
function cartInfo(){
  var n=0,total=0;
  Object.keys(S.cart).forEach(function(id){n+=S.cart[id];total+=S.cart[id]*PRICE[id];});
  return {n:n,total:total};
}
function render(){
  $('#tab-menu').setAttribute('aria-selected',S.tab==='menu');
  $('#tab-tables').setAttribute('aria-selected',S.tab==='tables');
  var pane=$('#pane'),foot=$('#foot');
  if(S.tab==='menu')renderMenu(pane,foot);else renderTables(pane,foot);
}
function renderMenu(pane,foot){
  var cat=MENU.filter(function(c){return c.id===S.cat;})[0];
  var h='<div class="chips" role="tablist" aria-label="أقسام المنيو">'+MENU.map(function(c){
    return '<button class="chip" role="tab" data-cat="'+c.id+'" aria-selected="'+(c.id===S.cat)+'">'+c.name+'</button>';
  }).join('')+'</div><ul class="items">';
  cat.items.forEach(function(it){
    var q=S.cart[it[0]]||0;
    h+='<li class="item"><span class="ico '+cat.id+'" aria-hidden="true">'+ICON[cat.id]+'</span>'+
      '<div class="txt"><b>'+it[1]+'</b><span>'+it[2]+'</span></div>'+
      '<div class="buy"><span class="price">'+fmt(it[3])+'</span>'+
      (q?'<div class="step"><button type="button" data-dec="'+it[0]+'" aria-label="نقّص '+it[1]+'">−</button><output>'+q+'</output><button type="button" data-inc="'+it[0]+'" aria-label="زيّد '+it[1]+'">+</button></div>'
        :'<button type="button" class="add" data-inc="'+it[0]+'" aria-label="أضف '+it[1]+'">أضف</button>')+
      '</div></li>';
  });
  h+='</ul>';
  var st=pane.scrollTop;
  pane.innerHTML=h;pane.scrollTop=st;
  var c=cartInfo();
  foot.innerHTML=c.n?
    '<div class="cartbar"><div><b>'+c.n+' عنصر</b><span>'+fmt(c.total)+'</span></div><button type="button" class="btn fill" data-send>أرسل الطلب</button></div>'+
    '<p class="note">'+(S.table?'يوصلك لطاولة '+S.table:'تستلمه من الكاونتر')+' · نموذج تجريبي، ما ينرسل شي فعلياً</p>'
    :'<p class="note">اختر من المنيو وبعدين أرسل الطلب. هذا نموذج تجريبي، ما ينرسل شي فعلياً.</p>';
}
function renderTables(pane,foot){
  var h='<div class="legend"><span><i style="background:#2f9a93"></i>فاضية</span><span><i style="background:#e2603f"></i>محجوزة</span><span><i style="background:#8b9aa0"></i>مشغولة</span><span><i style="background:#f2bd4b"></i>حجزك</span></div>';
  [0,1].forEach(function(fl){
    h+='<h3 class="fl">'+FLN[fl]+'</h3><div class="tgrid">';
    TABLES.filter(function(t){return t.fl===fl;}).forEach(function(t){
      var st=status(t.id),dis=(st==='busy'||st==='res');
      h+='<button type="button" class="tcard'+(st==='mine'?' mine':'')+'" data-t="'+t.id+'" aria-pressed="'+(S.table===t.id)+'"'+(dis?' disabled':'')+'><b>طاولة '+t.id+'</b><span>'+t.cap+' أشخاص</span><span>'+STATUS_AR[st]+'</span></button>';
    });
    h+='</div>';
  });
  var days=dayLabels();
  if(S.mine){
    var mt=tableOf(S.mine.id);
    h+='<div class="banner"><div><b>حجزك جاهز</b><br>طاولة '+mt.id+' · '+FLN[mt.fl]+' · '+S.mine.people+' أشخاص<br>'+days[S.mine.day]+' الساعة '+fmtTime(S.mine.t)+'</div><button type="button" class="btn" data-cancel>إلغاء الحجز</button></div>';
  }else if(S.table){
    var t=tableOf(S.table);
    if(S.people>t.cap)S.people=t.cap;
    h+='<div class="form"><h3>حجز طاولة '+t.id+'<small>'+FLN[t.fl]+' · تكفي '+t.cap+' أشخاص</small></h3>'+
      '<div><span class="lbl">اليوم</span><div class="days">'+days.map(function(d,i){return '<button type="button" class="chip" data-day="'+i+'" aria-pressed="'+(S.day===i)+'">'+d+'</button>';}).join('')+'</div></div>'+
      '<div><label class="lbl" for="rtime">الوقت اللي تريده</label><input type="time" id="rtime" class="timein" value="'+S.t+'" min="08:00" max="23:00"><p class="err" id="terr" role="alert"></p></div>'+
      '<div class="row"><span class="lbl" style="margin:0">عدد الأشخاص</span><div class="step"><button type="button" data-ppl="-1" aria-label="نقّص العدد">−</button><output>'+S.people+'</output><button type="button" data-ppl="1" aria-label="زيّد العدد">+</button></div></div>'+
      '<button type="button" class="btn fill" data-reserve>احجز طاولة '+t.id+'</button></div>';
  }else{
    h+='<p class="hint">اختر طاولة فاضية من القائمة أو اضغط عليها داخل الكافيه. تقدر تنتقل بين الطابقين من الأزرار فوق.</p>';
  }
  pane.innerHTML=h;
  var fm=pane.querySelector('.form,.banner');
  if(fm&&window.innerWidth<=820){try{fm.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}}
  foot.innerHTML='<p class="note">نموذج تجريبي، الحجز يبقى بهذي الصفحة فقط.</p>';
}

function pickTable(id){
  var st=status(id),t=tableOf(id);
  if(st==='busy'){toast('طاولة '+id+' مشغولة هسه');return;}
  if(st==='res'){toast('طاولة '+id+' محجوزة');return;}
  S.table=id;S.floor=t.fl;
  enter('tables');
}

/* ---------- events ---------- */
function act(el){
  var a=el.getAttribute('data-act');
  if(a==='enter')enter(S.tab);
  else if(a==='menu')enter('menu');
  else if(a==='floor'){setFloor(+el.getAttribute('data-to'));}
  else if(a==='table')pickTable(+el.getAttribute('data-id'));
}
var svg=$('#scene');

/* pan + zoom the whole scene: drag with mouse or finger, wheel or pinch to zoom */
var pan=$('#pan'),ptrs={},gest=null,suppress=false;
function applyV(anim){
  pan.style.transition=anim?'transform .7s cubic-bezier(.3,0,.2,1)':'none';
  pan.style.transform='translate('+f(V.x)+'px,'+f(V.y)+'px) scale('+V.k.toFixed(4)+')';
  $('#recenter').hidden=(V.x===0&&V.y===0&&V.k===1);
}
function toUser(cx,cy){var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(cx,cy,fac){
  var k2=Math.max(.6,Math.min(3.2,V.k*fac)),u=toUser(cx,cy),r=k2/V.k;
  V.x=u.x-(u.x-V.x)*r;V.y=u.y-(u.y-V.y)*r;V.k=k2;
}
svg.addEventListener('click',function(e){
  if(suppress){e.stopImmediatePropagation();e.preventDefault();}
},true);
svg.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===1)gest={mode:'drag',sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y,active:false};
  else if(ids.length===2){
    var a=ptrs[ids[0]],b=ptrs[ids[1]];
    gest={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,active:true};
  }
});
svg.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId]||!gest)return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs),s=svg.getScreenCTM().a;
  if(gest.mode==='drag'&&ids.length===1){
    var dx=e.clientX-gest.sx,dy=e.clientY-gest.sy;
    if(!gest.active){
      if(Math.hypot(dx,dy)<6)return;
      gest.active=true;
      try{svg.setPointerCapture(e.pointerId);}catch(err){}
      $('#stage').classList.add('panning');$('#tip').hidden=true;
    }
    V.x=gest.vx+dx/s;V.y=gest.vy+dy/s;applyV(false);
  }else if(gest.mode==='pinch'&&ids.length===2){
    var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    V.x+=(mx-gest.mx)/s;V.y+=(my-gest.my)/s;
    zoomAt(mx,my,d/gest.d);
    gest.d=d;gest.mx=mx;gest.my=my;applyV(false);
  }
});
function endPtr(e){
  delete ptrs[e.pointerId];
  var ids=Object.keys(ptrs);
  if(ids.length===0){
    if(gest&&gest.active){suppress=true;setTimeout(function(){suppress=false;},0);}
    gest=null;$('#stage').classList.remove('panning');
  }else if(ids.length===1){
    var p=ptrs[ids[0]];
    gest={mode:'drag',sx:p.x,sy:p.y,vx:V.x,vy:V.y,active:true};
  }
}
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',function(e){
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));applyV(false);
},{passive:false});
svg.addEventListener('dblclick',function(e){
  if(e.target.closest('[data-act]'))return;
  V={x:0,y:0,k:1};applyV(true);
});

svg.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el)act(el);
});
svg.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var el=e.target.closest('[data-act]');
  if(el&&el===e.target){e.preventDefault();act(el);}
});
svg.addEventListener('pointermove',function(e){
  var el=e.target.closest('[data-tip]'),tip=$('#tip');
  if(!el||e.pointerType==='touch'||(gest&&gest.active)){tip.hidden=true;return;}
  tip.textContent=el.getAttribute('data-tip');
  tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.hidden=false;
});
svg.addEventListener('pointerleave',function(){$('#tip').hidden=true;});

document.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t)return;
  if(t.id==='home'||t.id==='exit'){if(S.mode==='in')leave();return;}
  if(t.hasAttribute('data-go')){enter(t.getAttribute('data-go'));return;}
  if(t.hasAttribute('data-floor')){setFloor(+t.getAttribute('data-floor'));return;}
  if(t.hasAttribute('data-zoom')){
    var rc=svg.getBoundingClientRect();
    zoomAt(rc.left+rc.width/2,rc.top+rc.height/2,+t.getAttribute('data-zoom'));applyV(true);return;
  }
  if(t.id==='recenter'){V={x:0,y:0,k:1};applyV(true);return;}
  if(t.hasAttribute('data-tab')){S.tab=t.getAttribute('data-tab');render();return;}
  if(t.hasAttribute('data-cat')){S.cat=t.getAttribute('data-cat');render();return;}
  if(t.hasAttribute('data-inc')){var id=t.getAttribute('data-inc');S.cart[id]=(S.cart[id]||0)+1;render();return;}
  if(t.hasAttribute('data-dec')){var d=t.getAttribute('data-dec');S.cart[d]=(S.cart[d]||0)-1;if(S.cart[d]<=0)delete S.cart[d];render();return;}
  if(t.hasAttribute('data-send')){
    var no=100+Math.floor(Math.random()*900);
    S.cart={};render();
    toast('وصل طلبك رقم '+no+'. '+(S.table?'نوصله لطاولة '+S.table+'.':'استلمه من الكاونتر.'));return;
  }
  if(t.hasAttribute('data-t')){
    S.table=+t.getAttribute('data-t');
    var tt=tableOf(S.table);
    paintPins();
    if(tt.fl!==S.floor)setFloor(tt.fl);
    render();return;
  }
  if(t.hasAttribute('data-day')){S.day=+t.getAttribute('data-day');render();return;}
  if(t.hasAttribute('data-ppl')){
    var tb=tableOf(S.table);S.people=Math.max(1,Math.min(tb.cap,S.people+(+t.getAttribute('data-ppl'))));render();return;
  }
  if(t.hasAttribute('data-reserve')){
    var inp=$('#rtime');if(inp)S.t=inp.value;
    var er=timeErr();
    if(er){var box=$('#terr');if(box)box.textContent=er;if(inp)inp.focus();return;}
    S.mine={id:S.table,people:S.people,day:S.day,t:S.t};
    toast('تم حجز طاولة '+S.table+' '+dayLabels()[S.day]+' الساعة '+fmtTime(S.t)+'.');
    paintPins();render();return;
  }
  if(t.hasAttribute('data-cancel')){S.mine=null;toast('انلغى الحجز.');paintPins();render();return;}
});
document.addEventListener('input',function(e){
  if(e.target.id==='rtime'){S.t=e.target.value;var m=$('#terr');if(m)m.textContent=S.t?timeErr():'';}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.mode==='in')leave();});

/* drag the panel by its header */
var panel=$('#panel'),head=$('#phead'),off={x:0,y:0},drag=null;
function setOff(x,y){off.x=x;off.y=y;panel.style.setProperty('--dx',x+'px');panel.style.setProperty('--dy',y+'px');}
head.addEventListener('pointerdown',function(e){
  if(e.target.closest('button')||S.mode!=='in')return;
  drag={sx:e.clientX,sy:e.clientY,ox:off.x,oy:off.y};
  try{head.setPointerCapture(e.pointerId);}catch(err){}
  panel.classList.add('dragging');
});
head.addEventListener('pointermove',function(e){
  if(!drag)return;
  var st=$('#stage').getBoundingClientRect(),pr=panel.getBoundingClientRect();
  var bl=pr.left-off.x,bt=pr.top-off.y;
  var nx=drag.ox+e.clientX-drag.sx,ny=drag.oy+e.clientY-drag.sy;
  nx=Math.max(st.left+6-bl,Math.min(st.right-6-(bl+pr.width),nx));
  ny=Math.max(st.top+6-bt,Math.min(st.bottom-6-(bt+pr.height),ny));
  setOff(nx,ny);
});
function endDrag(){drag=null;panel.classList.remove('dragging');}
head.addEventListener('pointerup',endDrag);
head.addEventListener('pointercancel',endDrag);
head.addEventListener('dblclick',function(e){if(!e.target.closest('button'))setOff(0,0);});

var rz;
window.addEventListener('resize',function(){
  clearTimeout(rz);
  rz=setTimeout(function(){setOff(0,0);if(S.mode==='in')$('#cam').style.transform=camIn();},120);
});

/* ---------- start ---------- */
build();
$('#cam').style.transform=CAM0;
panel.inert=true;
paintPins();
setFocusable();
render();
})();
</script>

</body></html>
